version: "3.8"

services:
  ecommerce-app:
    build:
      context: .
      dockerfile: Dockerfile
    # Host port eşlemesi kaldırıldı, container kendi içinde 3001 portunu kullanacak
    # Ana Nginx üzerinden yönlendirme yapılacak
    ports:
      - "3001:3001"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    networks:
      - ecommerce-network

networks:
  ecommerce-network:
    driver: bridge
