# Cetinkayavinc uygulaması Nginx - sadece kendi portu üzerinde çalışacak
server {
    listen 3001;  # Bu port ana Nginx üzerinden yönlendirilecek
    server_name localhost;

    root /home/username/Cetinkayavinc/build;  # React build dizini
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    # Opsiyonel statik dosyalar için cache
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|ttf|eot|svg)$ {
        expires 30d;
        access_log off;
    }
}
