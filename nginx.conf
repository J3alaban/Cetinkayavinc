server {
    listen 80;
    server_name cetinkayavinc.com www.cetinkayavinc.com;
    # Tüm HTTP isteklerini HTTPS'e yönlendir
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name cetinkayavinc.com www.cetinkayavinc.com;

    # Certbot'un oluşturduğu sertifika yolları (Lütfen bu yolları kontrol et)
    ssl_certificate /etc/letsencrypt/live/cetinkayavinc.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cetinkayavinc.com/privkey.pem;

    # Eski cihazlar (iOS 10-12) için güvenlik protokolleri
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
